name: Update Nginx Proxy Manager

on:
  schedule:
    - cron: '0 0 * * *'  # 每天午夜执行
  workflow_dispatch: # 手动触发工作流

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Git
      run: |
        git config user.name "liuyie"
        git config user.email "314673846@qq.com"

    - name: Add upstream repository
      run: |
        git remote add upstream https://github.com/NginxProxyManager/nginx-proxy-manager.git
        git fetch upstream

    - name: Merge upstream releases into the fork
      run: |
        git checkout main
        git merge upstream/main

    - name: Push changes to the fork
      run: |
        git push origin main
